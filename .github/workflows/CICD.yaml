name: Streamlit Azure CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:
concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read
env:
  AZURE_RESOURCE_GROUP: rg-agentic
  AZURE_LOCATION: francecentral
  CONTAINER_APP_ENV: env-agentic
  CONTAINER_APP_NAME: stapp

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint code
        run: |
          echo "Linting repository"

      - name: Run unit tests
        run: |
          echo "Running unit tests"
          
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi

          echo "Docker image settings are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  continuous_deployment:
    name: Deploy to Azure Container Apps
    needs: push_to_registry
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate Azure and application secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
                      GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY ALPHA_VANTAGE_API_KEY OPENWEATHER_API_KEY \
                      LANGSMITH_TRACING LANGSMITH_ENDPOINT LANGSMITH_API_KEY LANGSMITH_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "$name secret is missing."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container app (create on first run, update afterwards)
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          set -euo pipefail

          az config set extension.use_dynamic_install=yes_without_prompt \
                        extension.dynamic_install_allow_preview=true

          # API keys are stored as Azure secrets and exposed as env vars via secretref.
          SECRETS=(
            "gemini-api-key=$GEMINI_API_KEY"
            "groq-api-key=$GROQ_API_KEY"
            "tavily-api-key=$TAVILY_API_KEY"
            "alpha-vantage-api-key=$ALPHA_VANTAGE_API_KEY"
            "openweather-api-key=$OPENWEATHER_API_KEY"
            "langsmith-api-key=$LANGSMITH_API_KEY"
          )

          ENV_VARS=(
            "Gemini_Api_Key=secretref:gemini-api-key"
            "GOOGLE_API_KEY=secretref:gemini-api-key"
            "GROQ_API_KEY=secretref:groq-api-key"
            "TAVILY_API_KEY=secretref:tavily-api-key"
            "ALPHA_VANTAGE_API_KEY=secretref:alpha-vantage-api-key"
            "OPENWEATHER_API_KEY=secretref:openweather-api-key"
            "LANGSMITH_API_KEY=secretref:langsmith-api-key"
            "LANGSMITH_TRACING=$LANGSMITH_TRACING"
            "LANGSMITH_ENDPOINT=$LANGSMITH_ENDPOINT"
            "LANGSMITH_PROJECT=$LANGSMITH_PROJECT"
          )

          # OpenAI is optional: only added when the secret is set.
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            SECRETS+=("openai-api-key=$OPENAI_API_KEY")
            ENV_VARS+=("OPENAI_API_KEY=secretref:openai-api-key")
          fi

          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

          if ! az containerapp env show \
                --name "$CONTAINER_APP_ENV" \
                --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Creating Container Apps environment..."
            az containerapp env create \
              --name "$CONTAINER_APP_ENV" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --output none
          fi

          if az containerapp show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then

            echo "Updating existing container app..."

            az containerapp secret set \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "${SECRETS[@]}" \
              --output none

            az containerapp registry set \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server docker.io \
              --username "$DOCKER_USERNAME" \
              --password "$DOCKER_PASSWORD" \
              --output none

            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars "${ENV_VARS[@]}" \
              --output none

          else

            echo "Creating container app..."

            # One replica only: SQLite and Streamlit session state are not multi-instance safe.
            az containerapp create \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENV" \
              --image "$IMAGE" \
              --registry-server docker.io \
              --registry-username "$DOCKER_USERNAME" \
              --registry-password "$DOCKER_PASSWORD" \
              --target-port 8501 \
              --ingress external \
              --cpu 1.0 \
              --memory 2.0Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --secrets "${SECRETS[@]}" \
              --env-vars "${ENV_VARS[@]}" \
              --output none
          fi

      - name: Verify Streamlit health endpoint
        run: |
          APP_URL=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Application URL: https://${APP_URL}"

          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 "https://${APP_URL}/_stcore/health" >/dev/null 2>&1; then
              echo "Streamlit application is healthy."
              exit 0
            fi

            echo "Waiting for Streamlit to become ready (attempt ${attempt}/18)..."
            sleep 10
          done

          echo "Streamlit did not become healthy."
          az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --tail 100 || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --tail 50 || true
